name: Validate skills and examples

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Record runtime
        run: python3 --version
      - name: Validate library and generated docs
        run: |
          python3 scripts/validate_skills.py .
          python3 scripts/skillctl.py docs --check
          python3 scripts/upstream_audit.py --check
          git diff --check HEAD^ HEAD
      - name: Run tooling and routing regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Package the exact tracked source for inspection
        if: matrix.os == 'ubuntu-24.04'
        run: |
          git archive --format=zip HEAD -o skill-library.zip
          git rev-parse HEAD > source-commit.txt
          sha256sum skill-library.zip > source-checksum.txt
      - name: Preserve the source candidate, not runtime secrets or build caches
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-library-source
          path: |
            skill-library.zip
            source-commit.txt
            source-checksum.txt
          if-no-files-found: error
          retention-days: 7

  apple-compilation:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Test portable core and compile macOS views
        run: |
          xcrun swift test --package-path examples/SkillExamples
          xcrun swift build --package-path examples/SkillExamples --target SkillExamplesUI
      - name: Repeat deterministic async interleavings
        run: |
          for attempt in 1 2 3 4 5; do
            xcrun swift test --package-path examples/SkillExamples --skip-build \
              --filter SearchIntegrationTests
          done
      - name: Compile examples against the installed iOS SDK
        run: |
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun swift build --package-path examples/SkillExamples \
            --scratch-path examples/SkillExamples/.build-ios \
            --sdk "$SDK_PATH" --triple arm64-apple-ios17.0 \
            --target SkillExamplesUI
          xcrun swift build --package-path examples/SkillExamples \
            --scratch-path examples/SkillExamples/.build-ios \
            --sdk "$SDK_PATH" --triple arm64-apple-ios17.0 \
            --target SkillExamplesPersistence
